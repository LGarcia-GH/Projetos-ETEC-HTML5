<!-- Título -->

<!-- Dados Pessoais -->

    <label>Dados Pessoais</label><br><br>
      <input type="text" name="nome" placeholder="Nome"><br>
      <input type="text" name="endereço" placeholder="Endereço"><br>
      <input type="text" name="cidade" placeholder="Cidade"><br>
      <select>
      <option value="São Paulo">São Paulo
      </option>
      <option name="Rio de Janeiro">Rio de Janeiro
    </select>
    </option><br><br>

<!-- Dados Profissionais -->

    <label>Dados Profissionais</label><br><br>
    <label>Natureza do Cargo</label><br>
    <label><input type="radio" name="gerencia" value="G" />
        Gerência</label>
    <label><input type="radio" name="financeiro" value="F" />
        Financeiro</label>
    <label><input type="radio" name="recepção" value="R" />
        Recepção</label>
    <label><input type="radio" name="administrativo" value="A" />
        Administração</label>
    <label><input type="radio" name="juridico" value="J" />
        Juridico</label><br><br>

<!-- Área de Interesse -->

   <label>Área de interesse</label><br>
          
   <label><input type="checkbox" name="computacao" value="computacao">Computação
   </label>
   <label><input type="checkbox" name="biologia" value="biologia">Biologia
   </label>
   <label><input type="checkbox" name="ambiente" value="ambiente">Meio Ambiente
   </label>
   <label><input type="checkbox" name="engenharia" value="engenharia">Engenharia
   </label>
   <label><input type="checkbox" name="historia" value="historia">História
   </label><br><br>

<!-- Mini-Curriculo -->

   <label>Mini-Curriculo</label>
   <textarea name="curriculo" rows="5" cols="30"></textarea>
   <input type="submit" value="Enviar"

</body>
