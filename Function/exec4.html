<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Contador</h2>
    <button onclick="contar(numero)" id="botao">Clique</button>
    <p><span id="contador"></span></p>

    <script>
        let numero = 0
        document.getElementById("botao").addEventListener("click", function () {
            numero ++;
            document.getElementById("contador").textContent = numero
        });
    </script>
</body>
</html>

<!-- .addEventListener() Pega um evento con id e ação que pode ser usado para aplicar uma função -->
