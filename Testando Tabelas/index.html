<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>
<body>
    <h2>Trabalhando com Tabelas</h2>
    <br>
        <table border="1">
            <caption>Primeiro Exemplo da Tabela</caption>
            <tr>
                <th>Coluna 1</th>
                <th>Coluna 2</th>
                <th>Coluna 3</th>
            </tr>
            <tr>
                <td>Item em Coluna 1</td>
                <td>Item em Coluna 2</td>
                <td>Item em Coluna 3</td>
            </tr>
            <tr>
                <td>Item em Coluna 4</td>
                <td>Item em Coluna 5</td>
                <td>Item em Coluna 6</td>
            </tr>
        </table>
</body>
</html>
