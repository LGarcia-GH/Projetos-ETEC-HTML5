<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="stylesheet" href="./CSS/style.css">
</head>

<body>
    <div class="caixaFormulario">
        <form action="/contato" method="post" class="formulario">
            <label for="nome">Nome Completo:</label>
            <input type="text" name="nome" id="nome" required>
            <br><br>
            <label for="email">E-Mail:</label>
            <input type="email" name="email" id="email" required>
            <br><br>
            <label for="senha">Senha</label>
            <input type="password" name="senha" id="senha" required>
            <br><br>
            <label for="nascimento" name="dataNascimento" id="dNascimento">Data de Nascimento</label required>
            <input type="date">
            <br><br>
            <label for="curso">Curso</label required>
            <br>
            <select name="curso" id="curso">
                <option value="">Selecione um Curso</option>
                <option value="ads">ADS</option>
                <option value="adsAms">ADS AMS</option>
                <option value="agro">Agronegócio</option>
                <option value="gestao">Gestão Empresarial</option>
                <option value="si">Sistemas Para Internet</option>
            </select>
            <br><br>
            <label for="mensagem">Mensagem</label>
            <br>
            <textarea name="mensagem" id="mensagem" rows="5">
            </textarea>
            <br>
            <button type="submit">Enviar</button>
            <button type="reset"> Limpar</button>
        </form>
    </div>
</body>

</html>
